<form>
  <div class="mb-3" [hidden]="ajout">
    <label class="form-label">ID Genre</label>
    <input type="text" [(ngModel)]="genre.idGenre" name="idGenre" class="form-control w-25" readonly>
  </div>

  <div class="mb-3">
    <label class="form-label">Nom Genre</label>
    <input type="text" [(ngModel)]="genre.nomGenre" name="nomGenre" class="form-control" placeholder="Entrez un nom de genre...">
  </div>

  <div class="mt-2">
    <button type="button" [disabled]="!genre.nomGenre" class="btn btn-success" (click)="saveGenre()">
      {{ajout ? 'Ajouter' : 'Modifier'}}
    </button>
  </div>
</form>
